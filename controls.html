<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device Controls</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Device Controls</h1>
      <div class="subtitle"><a href="index.html" style="color:inherit;text-decoration:none">← Back to Dashboard</a></div>
    </header>

    <main style="padding:18px">
      <section class="card">
        <h3>Toggle Devices</h3>
        <p style="color:var(--muted)">Click a device to switch it on or off. Changes update the live simulation.</p>
        <div class="device-list" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
          <button class="device" data-device="light1">Light 1 <span class="small">(10W)</span></button>
          <button class="device" data-device="light2">Light 2 <span class="small">(10W)</span></button>
          <button class="device" data-device="fan">Fan <span class="small">(75W)</span></button>
          <button class="device" data-device="ac">AC <span class="small">(1200W)</span></button>
          <button class="device" data-device="heater">Heater <span class="small">(1500W)</span></button>
          <button class="device" data-device="wall1">Wall Plug 1 <span class="small">(100W)</span></button>
          <button class="device" data-device="wall2">Wall Plug 2 <span class="small">(100W)</span></button>
        </div>

        <div style="margin-top:14px;display:flex;gap:8px">
          <button id="allOn" class="device" style="background:linear-gradient(90deg,var(--accent),#2fb6f1);color:#041227">Turn All On</button>
          <button id="allOff" class="device">Turn All Off</button>
        </div>
      </section>
    </main>

    <!-- Floating device access button + panel (same as dashboard) -->
    <button class="device-access" aria-label="Device controls" title="Device Controls">
      <span class="access-icon">⚡</span>
    </button>

    <div class="device-panel hidden" id="devicePanel" aria-hidden="true">
      <div class="device-panel-header">
        <strong>Device Controls</strong>
        <button class="close-panel" aria-label="Close">✕</button>
      </div>
      <div class="device-panel-body">
        <!-- Reuse same rows as dashboard for manual control -->
        <div class="device-row">
          <div class="label">Light 1</div>
          <div class="actions">
            <button class="device-action" data-device="light1" data-action="on">On</button>
            <button class="device-action" data-device="light1" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">Light 2</div>
          <div class="actions">
            <button class="device-action" data-device="light2" data-action="on">On</button>
            <button class="device-action" data-device="light2" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">Fan</div>
          <div class="actions">
            <button class="device-action" data-device="fan" data-action="on">On</button>
            <button class="device-action" data-device="fan" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">AC</div>
          <div class="actions">
            <button class="device-action" data-device="ac" data-action="on">On</button>
            <button class="device-action" data-device="ac" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">Heater</div>
          <div class="actions">
            <button class="device-action" data-device="heater" data-action="on">On</button>
            <button class="device-action" data-device="heater" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">Wall Plug 1</div>
          <div class="actions">
            <button class="device-action" data-device="wall1" data-action="on">On</button>
            <button class="device-action" data-device="wall1" data-action="off">Off</button>
          </div>
        </div>
        <div class="device-row">
          <div class="label">Wall Plug 2</div>
          <div class="actions">
            <button class="device-action" data-device="wall2" data-action="on">On</button>
            <button class="device-action" data-device="wall2" data-action="off">Off</button>
          </div>
        </div>
      </div>
    </div>

    <script defer src="app.js"></script>
  </body>
</html>
